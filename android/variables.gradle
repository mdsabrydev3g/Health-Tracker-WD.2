ext {
    // Capacitor 6 defaults were 22/34/34. Raised so the app can run on
    // modern devices and, critically, so exact alarms behave correctly.
    //
    // minSdkVersion 26     : Android 8 (2017). Covers every plausible device.
    // targetSdkVersion 35  : Android 15, per spec. Governs exact-alarm and
    //                        battery-optimisation behaviour.
    // compileSdkVersion 36 : must be >= targetSdk. Matches the local SDK.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 35
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}